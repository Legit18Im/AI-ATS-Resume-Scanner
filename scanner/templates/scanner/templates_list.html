<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Download Resume Templates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .template-card { transition: transform 0.2s; border: none; border-radius: 15px; overflow: hidden; }
        .template-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .icon-box { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 15px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-robot me-2"></i>AI ATS Scanner</a>
        <div class="d-flex">
            <a href="/" class="btn btn-outline-light btn-sm me-2">Home</a>
            <a href="/templates" class="btn btn-primary btn-sm">Templates</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold">ATS-Friendly Resume Templates</h1>
        <p class="text-muted lead">Optimized layouts designed to pass Applicant Tracking Systems.</p>
    </div>

    <div class="row g-4">
        {% for t in templates %}
        <div class="col-md-4">
            <div class="card template-card h-100 p-4 shadow-sm text-center">
                <div class="d-flex justify-content-center">
                    <div class="icon-box bg-{{ t.color }} bg-opacity-10 text-{{ t.color }}">
                        <i class="fas {{ t.icon }}"></i>
                    </div>
                </div>
                <h4 class="fw-bold">{{ t.name }}</h4>
                <p class="text-muted small mb-4">{{ t.desc }}</p>
                
                <div class="mt-auto">
                    <a href="/static/templates/{{ t.filename }}" class="btn btn-outline-{{ t.color }} w-100" download>
                        <i class="fas fa-download me-2"></i>Download .docx
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
